# Decap CMS Configuration
# 
# Two backend options:
# 1. github backend (default) — Requires a GitHub OAuth App. Set GITHUB_CLIENT_ID 
#    and GITHUB_CLIENT_SECRET as environment variables in your hosting dashboard.
# 2. git-gateway — Works with Netlify Identity. Enable Netlify Identity + Git Gateway
#    in your Netlify site settings.
#
# Using option 1 (github) by default. To switch to git-gateway, replace 
# `backend` section with: backend: { name: "git-gateway" }

backend:
  name: github
  repo: poula00saber/open-react-template
  branch: main
  base_url: https://api.github.com
  # For local development, use:
  # local_backend: true

# When using github backend, you need a GitHub OAuth App:
# 1. Go to GitHub Settings → Developer settings → OAuth Apps → New OAuth App
# 2. Set Homepage URL to your site URL (e.g., https://your-site.com)
# 3. Set Authorization callback URL to: https://api.github.com/oauth/authorize
# 4. Copy Client ID and Client Secret
# 5. Add as env vars: GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET in your hosting dashboard
# 
# For Vercel: https://vercel.com/docs/projects/environment-variables
# For Netlify: https://docs.netlify.com/environment-variables/overview/

publish_mode: editorial_workflow
media_folder: "public/images"
public_folder: "/images"

